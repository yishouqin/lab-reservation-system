<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理中心 - AI机房预约系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-animated"></div>
  <div class="particles" id="particles"></div>

  <div class="dashboard">
    <header class="dashboard-header">
      <div class="header-content">
        <div class="header-logo">
          <div class="header-logo-icon">🎀</div>
          <span class="header-logo-text">AI 机房预约系统 · 管理后台</span>
        </div>
        <div class="header-user">
          <div class="user-info">
            <div class="user-name" id="userName">管理员</div>
            <div class="user-role">管理员</div>
          </div>
          <div class="user-avatar" id="userAvatar">管</div>
          <button class="nav-btn nav-btn-secondary" onclick="handleLogout()">
            <span>🚪</span><span>退出登录</span>
          </button>
        </div>
      </div>
    </header>

    <main class="dashboard-main">
      <div class="welcome-section">
        <h1 class="welcome-title">欢迎回来，<span class="highlight" id="welcomeName">管理员</span> 👋</h1>
        <p class="welcome-desc">审核预约 · 查看机房 · AI智能分析</p>
      </div>

      <div class="stats-grid">
        <div class="glass-card stat-card">
          <div class="stat-icon cyan">📋</div>
          <div class="stat-content">
            <div class="stat-value" id="totalReservations">0</div>
            <div class="stat-label">总预约数</div>
          </div>
        </div>
        <div class="glass-card stat-card">
          <div class="stat-icon orange">⏳</div>
          <div class="stat-content">
            <div class="stat-value" id="pendingCount">0</div>
            <div class="stat-label">待审核</div>
          </div>
        </div>
        <div class="glass-card stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-content">
            <div class="stat-value" id="approvedCount">0</div>
            <div class="stat-label">已通过</div>
          </div>
        </div>
        <div class="glass-card stat-card">
          <div class="stat-icon purple">🤖</div>
          <div class="stat-content">
            <div class="stat-value" id="passRate">--</div>
            <div class="stat-label">通过率</div>
          </div>
        </div>
      </div>

      <!-- 审核预约 -->
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">📋 预约审核</h2>
          <span class="section-action" onclick="loadAll()">🔄 刷新</span>
        </div>
        <div class="reservation-list" id="reservationList"></div>
      </div>

      <!-- 查看空余机房 -->
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">🏢 空余机房查看</h2>
          <span class="section-action" onclick="loadRooms()">🔄 刷新</span>
        </div>
        <div class="rooms-grid" id="roomsGrid"></div>
      </div>

      <!-- AI智能分析 -->
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">🤖 AI 智能分析报告</h2>
          <span class="section-action" onclick="loadReport()">🔄 生成报告</span>
        </div>
        <div id="reportArea">
          <div class="glass-card" style="padding: 40px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
            <div style="color: var(--text-secondary); font-size: 14px;">点击"生成报告"查看AI智能分析</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="glass-card modal confirm-dialog">
      <div class="modal-body">
        <div class="confirm-icon danger" id="confirmIcon">⚠️</div>
        <div class="confirm-title" id="confirmTitle">确认操作</div>
        <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
        <div class="confirm-buttons">
          <button class="confirm-btn confirm-btn-cancel" id="confirmCancelBtn">取消</button>
          <button class="confirm-btn confirm-btn-confirm" id="confirmOkBtn">确认</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let allRooms = [];
    let allReservations = [];

    function createParticles() {
      const c = document.getElementById('particles');
      const cls = ['particle-cyan','particle-purple','particle-blue','particle-pink','particle-white'];
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle particle-dot ' + cls[Math.floor(Math.random()*cls.length)];
        p.style.left = Math.random()*100+'%';
        p.style.animationDelay = Math.random()*20+'s';
        p.style.animationDuration = (15+Math.random()*15)+'s, '+(2+Math.random()*3)+'s';
        p.style.width = (2+Math.random()*2)+'px';
        p.style.height = p.style.width;
        c.appendChild(p);
      }
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle particle-glow ' + cls[Math.floor(Math.random()*4)];
        p.style.left = Math.random()*100+'%';
        p.style.animationDelay = Math.random()*25+'s';
        p.style.animationDuration = (20+Math.random()*15)+'s, '+(3+Math.random()*3)+'s';
        p.style.width = (4+Math.random()*4)+'px';
        p.style.height = p.style.width;
        c.appendChild(p);
      }
    }

    function showConfirmDialog(options) {
      const m = document.getElementById('confirmModal');
      document.getElementById('confirmIcon').textContent = options.icon || '⚠️';
      document.getElementById('confirmIcon').className = 'confirm-icon ' + (options.type || 'warning');
      document.getElementById('confirmTitle').textContent = options.title || '确认操作';
      document.getElementById('confirmMessage').textContent = options.message || '确定要执行此操作吗？';
      document.getElementById('confirmOkBtn').textContent = options.confirmText || '确认';
      document.getElementById('confirmCancelBtn').textContent = options.cancelText || '取消';
      m.classList.add('active');
      const ok = document.getElementById('confirmOkBtn');
      const cancel = document.getElementById('confirmCancelBtn');
      const newOk = ok.cloneNode(true);
      const newCancel = cancel.cloneNode(true);
      ok.parentNode.replaceChild(newOk, ok);
      cancel.parentNode.replaceChild(newCancel, cancel);
      newOk.addEventListener('click', function() {
        m.classList.remove('active');
        if (options.onConfirm) options.onConfirm();
      });
      newCancel.addEventListener('click', function() {
        m.classList.remove('active');
        if (options.onCancel) options.onCancel();
      });
    }

    function handleLogout() {
      Storage.clearCurrentUser();
      window.location.href = 'login.html?logout=1';
    }

    async function init() {
      createParticles();
      const user = Storage.getCurrentUser();
      if (!user || user.role !== 'admin') {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('userName').textContent = user.username;
      document.getElementById('welcomeName').textContent = user.username;
      document.getElementById('userAvatar').textContent = user.username.charAt(0);
      await loadAll();
    }

    async function loadAll() {
      try {
        allRooms = await Storage.getRooms();
        allReservations = await Storage.getReservations();
        renderReservations();
        renderRooms();
        updateStats();
      } catch (e) {
        Utils.showToast('加载失败: ' + e.message, 'error');
      }
    }

    async function loadRooms() {
      allRooms = await Storage.getRooms();
      allReservations = await Storage.getReservations();
      renderRooms();
      Utils.showToast('机房数据已刷新', 'success');
    }

    function renderReservations() {
      const list = document.getElementById('reservationList');
      if (allReservations.length === 0) {
        list.innerHTML = '<div class="glass-card" style="padding:40px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">📭</div><div style="color:var(--text-secondary);font-size:14px;">暂无预约记录</div></div>';
        return;
      }
      allReservations.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      list.innerHTML = allReservations.map(r => {
        const room = allRooms.find(rm => rm.id == r.roomId);
        const st = Utils.formatStatus(r.status);
        const isPending = r.status === 'pending';
        return '<div class="glass-card reservation-item">' +
          '<div class="reservation-icon">🖥️</div>' +
          '<div class="reservation-info">' +
            '<div class="reservation-room">' + (room ? room.name : '未知机房') + '</div>' +
            '<div class="reservation-time">' + Utils.formatDate(r.date) + ' · ' + Utils.formatInterval(r.interval) +
              ' · 申请人：' + r.stuName + (r.purpose ? ' · 用途：' + r.purpose : '') + '</div>' +
          '</div>' +
          '<div class="reservation-status ' + st.class + '">' + st.icon + ' ' + st.text + '</div>' +
          (isPending ?
            '<button class="btn btn-primary btn-sm" style="margin-left:8px;padding:6px 16px;font-size:12px;" onclick="reviewRes(' + r.id + ',\'approved\')">✅ 通过</button>' +
            '<button class="btn btn-secondary btn-sm" style="margin-left:4px;padding:6px 16px;font-size:12px;" onclick="reviewRes(' + r.id + ',\'rejected\')">❌ 驳回</button>'
            : '') +
        '</div>';
      }).join('');
    }

    function renderRooms() {
      const grid = document.getElementById('roomsGrid');
      grid.innerHTML = allRooms.map(room => {
        let totalLoad = 0, cnt = 0;
        for (let d = 1; d <= 5; d++) {
          for (let i = 1; i <= 2; i++) {
            const active = allReservations.filter(r =>
              r.date == d && r.interval == i && r.roomId == room.id &&
              (r.status === 'pending' || r.status === 'approved')
            );
            totalLoad += active.length / room.capacity;
            cnt++;
          }
        }
        const avgLoad = totalLoad / cnt;
        const heat = AIRecommender.getHeatLevel(avgLoad);
        const free = room.capacity - allReservations.filter(r =>
          r.roomId == room.id && (r.status === 'pending' || r.status === 'approved')
        ).length;
        const progressClass = avgLoad < 0.3 ? 'green' : (avgLoad < 0.7 ? 'orange' : 'red');
        return '<div class="glass-card room-card">' +
          '<div class="room-header">' +
            '<div class="room-name">' + room.name + '</div>' +
            '<div class="room-status ' + heat.class + '">' + heat.icon + ' ' + heat.level + '</div>' +
          '</div>' +
          '<div class="room-info">' +
            '<div class="room-info-item"><span class="room-info-label">位置</span><span class="room-info-value">' + room.location + '</span></div>' +
            '<div class="room-info-item"><span class="room-info-label">容量</span><span class="room-info-value">' + room.capacity + ' 人</span></div>' +
            '<div class="room-info-item"><span class="room-info-label">空余</span><span class="room-info-value" style="color:var(--accent-green);font-weight:700;">' + Math.max(0, free) + ' 位</span></div>' +
            '<div class="room-info-item"><span class="room-info-label">占用率</span><span class="room-info-value">' + Math.round(avgLoad*100) + '%</span></div>' +
          '</div>' +
          '<div class="room-progress"><div class="progress-bar"><div class="progress-fill ' + progressClass + '" style="width:' + (avgLoad*100) + '%"></div></div></div>' +
          '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6;">' + room.description + '</p>' +
        '</div>';
      }).join('');
    }

    function updateStats() {
      document.getElementById('totalReservations').textContent = allReservations.length;
      document.getElementById('pendingCount').textContent = allReservations.filter(r => r.status === 'pending').length;
      document.getElementById('approvedCount').textContent = allReservations.filter(r => r.status === 'approved').length;
      const total = allReservations.filter(r => r.status === 'approved' || r.status === 'rejected').length;
      const approved = allReservations.filter(r => r.status === 'approved').length;
      document.getElementById('passRate').textContent = total === 0 ? '--' : Math.round(approved/total*100) + '%';
    }

    function reviewRes(id, status) {
      const action = status === 'approved' ? '通过' : '驳回';
      showConfirmDialog({
        icon: status === 'approved' ? '✅' : '❌',
        type: status === 'approved' ? 'success' : 'warning',
        title: '审核确认',
        message: '确定要' + action + '这条预约吗？',
        confirmText: '确认' + action,
        cancelText: '取消',
        onConfirm: async function() {
          const ok = await Storage.reviewReservation(id, status);
          if (ok) {
            Utils.showToast('审核' + action + '成功', 'success');
            await loadAll();
          } else {
            Utils.showToast('操作失败', 'error');
          }
        }
      });
    }

    async function loadReport() {
      try {
        const report = await AIRecommender.getReport();
        const d = report;
        let html = '';

        // 1. 数据总览
        html += '<div class="glass-card" style="padding:24px;margin-bottom:20px;">';
        html += '<h3 style="margin-bottom:16px;">📊 一、预约数据总览</h3>';
        html += '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;text-align:center;">';
        html += '<div><div style="font-size:28px;font-weight:700;color:var(--accent-blue);">' + d.total + '</div><div style="font-size:12px;color:var(--text-secondary);">总预约</div></div>';
        html += '<div><div style="font-size:28px;font-weight:700;color:var(--accent-orange);">' + d.pending + '</div><div style="font-size:12px;color:var(--text-secondary);">审核中</div></div>';
        html += '<div><div style="font-size:28px;font-weight:700;color:var(--accent-green);">' + d.approved + '</div><div style="font-size:12px;color:var(--text-secondary);">已通过</div></div>';
        html += '<div><div style="font-size:28px;font-weight:700;color:var(--accent-red);">' + d.rejected + '</div><div style="font-size:12px;color:var(--text-secondary);">已驳回</div></div>';
        html += '<div><div style="font-size:28px;font-weight:700;color:var(--accent-purple);">' + d.cancelled + '</div><div style="font-size:12px;color:var(--text-secondary);">已取消</div></div>';
        html += '</div>';
        html += '<div style="margin-top:16px;text-align:center;font-size:16px;">通过率：<strong style="color:var(--accent-green);">' + d.passRate + '%</strong></div>';
        html += '</div>';

        // 2. 机房热度
        html += '<div class="glass-card" style="padding:24px;margin-bottom:20px;">';
        html += '<h3 style="margin-bottom:16px;">🔥 二、机房热度排行</h3>';
        d.roomHeat.forEach((r, i) => {
          const room = allRooms.find(rm => rm.id == r.roomId);
          const medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : '  '));
          const pct = Math.round(r.avgLoad * 100);
          const cls = pct < 30 ? 'green' : (pct < 70 ? 'orange' : 'red');
          html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">';
          html += '<span style="font-size:20px;width:30px;">' + medal + '</span>';
          html += '<span style="width:120px;font-size:14px;">' + (room ? room.name : '机房'+r.roomId) + '</span>';
          html += '<div class="progress-bar" style="flex:1;height:20px;"><div class="progress-fill ' + cls + '" style="width:' + pct + '%">' + pct + '%</div></div>';
          html += '<span style="width:60px;text-align:right;font-size:13px;">' + r.count + '条</span>';
          html += '</div>';
        });
        html += '</div>';

        // 3. 各时段分布
        html += '<div class="glass-card" style="padding:24px;margin-bottom:20px;">';
        html += '<h3 style="margin-bottom:16px;">📅 三、各时段预约分布</h3>';
        const days = ['','周一','周二','周三','周四','周五'];
        const maxCount = Math.max(...Object.values(d.dayCount), 1);
        for (let dd = 1; dd <= 5; dd++) {
          const cnt = d.dayCount[dd] || 0;
          const pct = Math.round(cnt / maxCount * 100);
          html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">';
          html += '<span style="width:50px;font-size:14px;">' + days[dd] + '</span>';
          html += '<div class="progress-bar" style="flex:1;height:18px;"><div class="progress-fill" style="width:' + pct + '%;background:linear-gradient(90deg,#ff8fab,#ff4081);">' + cnt + '</div></div>';
          html += '</div>';
        }
        html += '</div>';

        // 4. AI资源优化
        html += '<div class="glass-card" style="padding:24px;margin-bottom:20px;">';
        html += '<h3 style="margin-bottom:16px;">💡 四、AI 资源优化建议</h3>';
        html += '<p style="margin-bottom:8px;font-weight:600;">最空闲 TOP5（推荐引导预约）：</p>';
        d.topFree.forEach((s, i) => {
          const room = allRooms.find(rm => rm.id == s.roomId);
          html += '<div style="margin-bottom:4px;font-size:13px;">' + (i+1) + '. ' + Utils.formatDate(s.date) + ' ' + Utils.formatInterval(s.interval).split(' ')[0] + ' - ' + (room ? room.name : '机房'+s.roomId) + ' （占用' + Math.round(s.load*100) + '%）</div>';
        });
        if (d.topBusy.length > 0) {
          html += '<p style="margin:12px 0 8px;font-weight:600;">最拥挤 TOP3（建议分流）：</p>';
          d.topBusy.forEach((s, i) => {
            const room = allRooms.find(rm => rm.id == s.roomId);
            html += '<div style="margin-bottom:4px;font-size:13px;color:var(--accent-orange);">' + (i+1) + '. ' + Utils.formatDate(s.date) + ' ' + Utils.formatInterval(s.interval).split(' ')[0] + ' - ' + (room ? room.name : '机房'+s.roomId) + ' （占用' + Math.round(s.load*100) + '%）</div>';
          });
        }
        html += '</div>';

        // 5. 异常检测
        html += '<div class="glass-card" style="padding:24px;">';
        html += '<h3 style="margin-bottom:16px;">🔍 五、异常行为检测</h3>';
        if (d.anomalies.length === 0) {
          html += '<div style="text-align:center;padding:20px;color:var(--accent-green);">✅ 未检测到异常行为</div>';
        } else {
          d.anomalies.forEach(a => {
            html += '<div style="padding:10px 16px;margin-bottom:8px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);">';
            html += '⚠️ <strong>' + a.name + '</strong> - ' + a.type + '：' + a.rate + '%（' + a.detail + '）';
            html += '</div>';
          });
        }
        html += '</div>';

        document.getElementById('reportArea').innerHTML = html;
        Utils.showToast('AI报告已生成', 'success');
      } catch (e) {
        Utils.showToast('报告生成失败: ' + e.message, 'error');
      }
    }

    // 自动刷新（每30秒）
    setInterval(async function() {
      try {
        allRooms = await Storage.getRooms();
        allReservations = await Storage.getReservations();
        renderReservations();
        renderRooms();
        updateStats();
      } catch (e) {}
    }, 30000);

    init();
  </script>
</body>
</html>
